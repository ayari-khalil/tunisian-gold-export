<svg viewBox="0 0 100 100" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Gold Gradient -->
    <linearGradient id="goldDropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Deep Olive Leaf Gradient -->
    <linearGradient id="oliveLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F6212" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Highlight Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ornamental Ring -->
  <circle cx="50" cy="50" r="46" stroke="#D97706" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Sunburst Rays / Star Accents -->
  <circle cx="50" cy="4" r="2.2" fill="#F59E0B" />
  <circle cx="50" cy="96" r="2.2" fill="#F59E0B" />
  <circle cx="4" cy="50" r="2.2" fill="#F59E0B" />
  <circle cx="96" cy="50" r="2.2" fill="#F59E0B" />

  <!-- Left Olive Branch & Leaf -->
  <path d="M 28 65 C 24 50, 32 32, 44 26 C 40 38, 38 52, 28 65 Z" fill="url(#oliveLeafGrad)" />
  <path d="M 31 52 C 20 44, 18 32, 26 24 C 30 34, 31 44, 31 52 Z" fill="url(#oliveLeafGrad)" opacity="0.85" />

  <!-- Right Olive Branch & Leaf -->
  <path d="M 72 65 C 76 50, 68 32, 56 26 C 60 38, 62 52, 72 65 Z" fill="url(#oliveLeafGrad)" />
  <path d="M 69 52 C 80 44, 82 32, 74 24 C 70 34, 69 44, 69 52 Z" fill="url(#oliveLeafGrad)" opacity="0.85" />

  <!-- Central Golden Olive Oil Drop -->
  <path d="M 50 20 C 50 20, 33 45, 33 60 C 33 69.38 40.62 77 50 77 C 59.38 77 67 69.38 67 60 C 67 45, 50 20, 50 20 Z" fill="url(#goldDropGrad)" filter="url(#goldGlow)" />

  <!-- Golden Drop Inner Specular Highlight -->
  <path d="M 44 50 C 42 54, 42 62, 45 66 C 43 64, 43 56, 46 50 Z" fill="#FFFFFF" opacity="0.65" />

  <!-- Small Golden Olive Fruit Accent -->
  <ellipse cx="50" cy="84" rx="4.5" ry="3" fill="url(#goldDropGrad)" />
</svg>
